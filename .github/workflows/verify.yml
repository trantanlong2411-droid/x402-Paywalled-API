name: Pharos Atlantic x402 — unit tests and Worker bundle
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Test x402 challenge, EIP-3009 verification, underpayment, receipt safety
        run: npm test
      - name: Compile Cloudflare Worker and SQLite Durable Object
        run: npm run build
