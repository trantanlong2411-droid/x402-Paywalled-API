name: Pharos Atlantic x402 — real read-only token audit
on:
  push:
    branches: [main]
    paths:
      - 'scripts/audit-atlantic.mjs'
      - '.github/workflows/verify-atlantic.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  read-only-real-chain:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Audit actual Pharos Atlantic 688689 x402 token
        run: npm run audit
      - name: Archive token network evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: pharos-x402-atlantic-token-audit
          path: proof/atlantic-token-audit.json
          retention-days: 30
          if-no-files-found: error
